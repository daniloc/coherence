name: Publish

# Tag-driven release: the GitHub ruleset "Release tags are immutable" blocks updates
# and deletion of existing v* refs while leaving creation open. Main CI owns
# qualification; this workflow only proves that the tagged SHA passed it and that the
# two public names (git tag and npm version) agree.
# Publishing uses OIDC trusted publishing, so no npm token exists in this repository.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the OIDC exchange with the npm registry
      contents: write # gh release create
      actions: read # prove this exact main SHA passed the broader CI workflow
    steps:
      - uses: actions/checkout@v4
      - name: Refuse an unqualified release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          qualified="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --branch main \
            --event push \
            --status success \
            --json headSha \
            --limit 20 \
            --jq 'length')"
          [ "$qualified" -gt 0 ] || {
            echo "no successful main CI run exists for exact tagged commit $GITHUB_SHA" >&2
            echo "push the commit to main, wait for CI, then rerun this tag workflow" >&2
            exit 1
          }
      - name: Refuse a tag that disagrees with package.json
        run: |
          package_tag="v$(node -p "require('./package.json').version")"
          [ "$package_tag" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME != package.json $package_tag" >&2
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # engines: >=22 (native TS type-stripping)
          cache: npm
      - name: Publish to npm, or verify an exact-SHA replay
        run: |
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          publication="$(node scripts/npm-publication-state.mjs "$package" "$version")"
          state="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).state)' "$publication")"
          if [ "$state" = "existing" ]; then
            existing="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).gitHead)' "$publication")"
            [ "$existing" = "$GITHUB_SHA" ] || {
              echo "$package@$version already exists from $existing, not tagged commit $GITHUB_SHA" >&2
              exit 1
            }
            echo "$package@$version already published from this exact SHA; continuing replay"
          elif [ "$state" = "absent" ]; then
            # OIDC publish needs npm >= 11.5.1; Node 22 bundles npm 10.x.
            npm install -g npm@latest
            # Install build dependencies without running prepare here. npm publish
            # runs prepare once against the exact source that it packs.
            npm ci --ignore-scripts
            npm publish
          else
            echo "unknown publication state: $state" >&2
            exit 1
          fi
      - name: Cut the GitHub release with autogenerated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
