name: Publish

# Tag-driven release: pushing a v* tag publishes to npm and cuts a GitHub release
# with autogenerated notes. Publishing uses OIDC trusted publishing — the runner
# proves its identity to the registry directly, so no npm token exists in this
# repo's secrets, and npm attaches provenance automatically. One-time pairing on
# npmjs.com: package Settings → Trusted publishing → GitHub Actions, with
# repository daniloc/coherence and workflow filename publish.yml.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the OIDC exchange with the npm registry
      contents: write # gh release create
      actions: read # prove this exact main SHA passed the broader CI workflow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse an unqualified or off-main release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tagged commit $GITHUB_SHA is not on origin/main" >&2
            exit 1
          }
          qualified="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --branch main \
            --event push \
            --status success \
            --json headSha \
            --limit 20 \
            --jq 'length')"
          [ "$qualified" -gt 0 ] || {
            echo "no successful main CI run exists for exact tagged commit $GITHUB_SHA" >&2
            echo "push the commit to main, wait for CI, then rerun this tag workflow" >&2
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # engines: >=22 (native TS type-stripping)
          cache: npm
        # OIDC publish needs npm >= 11.5.1; node 22 bundles npm 10.x.
      - run: npm install -g npm@latest
      - run: npm ci # installs deps + runs prepare → tsc build
      - run: npm test
        timeout-minutes: 5
      - name: Smoke-test the packed artifact in a fresh consumer
        run: node scripts/package-smoke.mjs
        timeout-minutes: 5
      - name: Refuse a tag that disagrees with package.json
        # A tag pushed without the version bump would otherwise publish a version
        # npm already has (hard error) or, worse, re-label old code as new.
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          [ "$pkg" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $pkg" >&2; exit 1; }
      - name: Publish to npm, or verify an exact-SHA replay
        run: |
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          # NO --json here: under --json, npm prints an E404 for an unpublished version
          # as JSON on STDOUT, which read as a nonempty `existing` and made the guard
          # refuse the FIRST publish of every version (def-ebfedf53d47f, the v0.36.0
          # tag's failed run). Plain output keeps errors on stderr; the || true then
          # only converts "not published yet" into the empty string it was meant to be.
          existing="$(npm view "$package@$version" gitHead 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -n "$existing" ]; then
            [ "$existing" = "$GITHUB_SHA" ] || {
              echo "$package@$version already exists from $existing, not tagged commit $GITHUB_SHA" >&2
              exit 1
            }
            echo "$package@$version already published from this exact SHA; continuing replay"
          else
            npm publish
          fi
      - name: Cut the GitHub release with autogenerated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
