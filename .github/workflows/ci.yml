name: CI

# The harness gates every consumer project; this gates the harness on itself.
# `npm ci` runs the `prepare` build (tsc must compile), then the node:test suite
# runs — TypeScript is stripped natively, so no test framework is installed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # signal compares this change with the real PR/push base
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # engines: >=22 (native TS type-stripping, no --flag needed)
          cache: npm
      - run: npm ci # installs deps + runs prepare → tsc build (a build break fails here)
      # A non-exiting node:test worker hid behind GitHub's six-hour job default from
      # v0.14.0 through v0.30.0. The measured full-suite runtime is under one minute;
      # five minutes leaves headroom while making this failure observable the same run.
      - run: npm test
        timeout-minutes: 5
      - name: Smoke-test the packed artifact in a fresh consumer
        run: node scripts/package-smoke.mjs
        timeout-minutes: 5
      - name: Check per-change read signaling
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${PUSH_BASE:-HEAD^}}"
          git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD^
          node src/cli.ts signal --check --since "$base"
      - name: Check premise leases
        run: node src/cli.ts premise --check
      - name: Check committed coherence reading surfaces
        run: node src/cli.ts docs --check
      - name: Check invariant rationale coverage
        run: node src/cli.ts why-lint --check
      # THE RATCHETS AND THE ATLAS — added 2026-08-03, after an audit measured that this
      # workflow ran 2 of the 7 gates the harness ships. `verify` and `docs` were the two,
      # and they are the two everybody looks at, which is why "coherence dogfoods itself"
      # survived five releases without being true. Each of these costs well under a second
      # (measured: 0.49 / 0.30 / 0.25 / 0.38s), so per-push is the right home for all four.
      #
      # `contracts` is deliberately ABSENT and that absence is reasoned, not an omission:
      # this repo ships ONE path-addressable deploy unit, so `cfg.artifacts` has nothing to
      # partition and the detector would print a checkmark over an empty population. See
      # the decision journal (2026-08-03) for the measurement and for what would flip it.
      - name: Check the mass ratchet (includes the graph POPULATION floor.ts prescribes)
        # `mass.measures` counts component nodes and claim lines in the DERIVED graph.
        # floor.ts:42 named this pin as the mitigation for the one collapse the non-vacuity
        # floor deliberately cannot gate — a gradual N→1 shrink where each step looks like
        # an ordinary spec deletion. Without it that mitigation was prose.
        run: node src/cli.ts mass --check
      - name: Check the convention ratchet
        run: node src/cli.ts conventions --check
      - name: Check the interpolation-surface ratchet
        run: node src/cli.ts lint-sinks --check
      - name: Check the trust atlas (drift / dangling / over-claim)
        # Drift is the load-bearing verdict here: every boundary chokepoint in the spec
        # tree must be mapped to a crossing or declared a within-chart non-transition, so a
        # new boundary cannot be added without saying what it crosses.
        run: node src/cli.ts atlas --check
      - name: Materialize a read-only verification snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/coherence-verify"
          git archive HEAD -o "$RUNNER_TEMP/coherence-verify.tar"
          tar -xf "$RUNNER_TEMP/coherence-verify.tar" -C "$RUNNER_TEMP/coherence-verify"
          # The FULL tier boots guard oracles inside the snapshot; their test files
          # resolve imports from the snapshot, so it borrows the workspace's deps.
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/coherence-verify/node_modules"
      - name: Verify the repository's own specs (FULL tier)
        # Full, not --fast, and this is load-bearing: --fast degrades `via guard` to
        # symbol existence, so a renamed/orphaned guard oracle keeps every automated
        # gate green (audit M4, 2026-07-31 — a retitled guard test left npm test
        # passing and `verify --fast` "✓ coherent"; only the full tier reds it).
        working-directory: ${{ runner.temp }}/coherence-verify
        run: node "$GITHUB_WORKSPACE/src/cli.ts" verify
